<div class="login-container">
  <h2>Login</h2>

  <label for="email">Email</label>
  <input id="email" name="email" [(ngModel)]="email" type="email" placeholder="Enter your email" />

  <label for="password">Password</label>
  <input id="password" name="password" [(ngModel)]="password" type="password" placeholder="Enter your password" />

  <button (click)="onLogin()">Login</button>

  <p *ngIf="error" class="error-msg">{{ error }}</p>
</div>
